name: Build and release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'tool/release*'
      - 'tool/tests/test_release.py'
      - 'tool/android-release-signing.py'
      - 'tool/tests/test_android_release_signing.py'
      - '.fvmrc'
      - 'pubspec.lock'
      - 'apps/raft_flutter/windows/**'
      - 'apps/raft_flutter/android/**'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated platforms; empty uses enabled platforms in tool/release-platforms.json'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      build_number: ${{ steps.plan.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tool/tests -p test_release.py -v
      - id: plan
        env:
          RELEASE_PLATFORMS: ${{ inputs.platforms }}
        run: python tool/release.py plan

  build:
    needs: plan
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      RELEASE_BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - name: Select the pinned SDK wrapper
        run: python tool/release.py sdk
      - name: Initialize the downloaded Flutter SDK
        run: flutter --version --machine
      - name: Set up Java for Android
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install Android SDK components
        if: matrix.platform == 'android'
        shell: bash
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - name: Install Linux build and media dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libmpv2 patchelf poppler-utils
          python tool/prepare-media-linux
      - name: Resolve locked dependencies
        run: python tool/flutter pub get --enforce-lockfile
      - name: Build and package desktop
        if: matrix.platform != 'android'
        run: python tool/release.py build ${{ matrix.platform }}
      - name: Build and verify signed ARM64 Android APK
        if: matrix.platform == 'android' && github.event_name != 'pull_request'
        env:
          RAFT_ANDROID_KEYSTORE_BASE64: ${{ secrets.RAFT_ANDROID_KEYSTORE_BASE64 }}
          RAFT_ANDROID_STORE_PASSWORD: ${{ secrets.RAFT_ANDROID_STORE_PASSWORD }}
          RAFT_ANDROID_KEY_PASSWORD: ${{ secrets.RAFT_ANDROID_KEY_PASSWORD }}
          RAFT_ANDROID_KEY_ALIAS: ${{ secrets.RAFT_ANDROID_KEY_ALIAS }}
        run: python tool/release.py build android
      - name: Ensure tracked dependencies stayed locked
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: build/release
          merge-multiple: true
      - name: Verify all artifacts and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: python tool/release.py publish
